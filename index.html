<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانش راه نجات - هوشا و کوشا</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.95);
            --text-color: #ffffff;
            --border-color: #bbf7d0;
            --yellow-pastel: #fef08a;
            --pink-pastel: #fbcfe8;
            --red-pastel: #fca5a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .site-container {
            width: 100%;
            max-width: 900px;
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title-panel {
            background: linear-gradient(90deg, var(--pink-pastel), #fff);
            padding: 8px 20px;
            border-radius: 50px;
            color: #1e293b;
            font-weight: bold;
        }

        /* گالری تصاویر شبکه ای و بزرگ */
        .gallery-section {
            width: 100%;
            margin: 20px 0;
        }

        .gallery-title {
            color: var(--yellow-pastel);
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .game-screenshot {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .game-screenshot:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px var(--yellow-pastel);
        }

        /* کادر بهینه و جمع وجور ویدیو */
        .video-section {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed var(--red-pastel);
            border-radius: 20px;
            padding: 15px;
            margin: 25px 0;
            text-align: center;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 12px;
        }

        .btn-action {
            padding: 8px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .btn-download { background: var(--yellow-pastel); color: #0f172a; }
        .btn-aparat { background: var(--red-pastel); color: #fff; }

        /* لایت باکس بزرگنمایی عکس */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 12px;
            border: 3px solid var(--yellow-pastel);
        }
    </style>
</head>
<body>

    <div class="site-container">
        <header>
            <div class="title-panel">بازی دانش: راه نجات</div>
        </header>

        <!-- بخش تصاویر با ابعاد بزرگ و واضح -->
        <div class="gallery-section">
            <h3 class="gallery-title">📸 تصاویر بازی (برای بزرگنمایی کلیک کنید)</h3>
            <div class="image-grid">
                <img src="/assets/screenshots/img1.jpg" class="game-screenshot" onclick="openFullImage(this.src)" alt="تصویر ۱">
                <img src="/assets/screenshots/img2.jpg" class="game-screenshot" onclick="openFullImage(this.src)" alt="تصویر ۲">
                <img src="/assets/screenshots/img3.jpg" class="game-screenshot" onclick="openFullImage(this.src)" alt="تصویر ۳">
                <img src="/assets/screenshots/img4.jpg" class="game-screenshot" onclick="openFullImage(this.src)" alt="تصویر ۴">
            </div>
        </div>

        <!-- بخش کادر ویدیو بدون اشغال فضای عکس‌ها -->
        <div class="video-section">
            <p style="color: var(--red-pastel); font-weight: bold;">🎬 تیزر معرفی بازی</p>
            <div class="video-container">
                <iframe src="https://www.aparat.com/video/video/embed/videohash/rvn6c75/vt/frame" allowfullscreen="true"></iframe>
            </div>
            <div class="btn-group">
                <a href="https://aparat.com/v/rvn6c75" target="_blank" class="btn-action btn-aparat">مشاهده در آپارات</a>
                <a href="https://www.aparat.com/api/fa/v1/video/video/download/videohash/rvn6c75" target="_blank" class="btn-action btn-download">📥 دانلود ویدیو</a>
            </div>
        </div>
    </div>

    <!-- لایت‌باکس عکس -->
    <div class="lightbox" id="lightbox" onclick="closeFullImage()">
        <img id="lightboxImg" src="" alt="نمایش بزرگ عکس">
    </div>

    <script>
        function openFullImage(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeFullImage() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>
</body>
</html>
